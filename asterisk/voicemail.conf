; voicemail.conf - Buzones de voz

[general]
format=wav49|wav        ; formatos en que se guardan los mensajes
maxmsg=50               ; máximo de mensajes por buzón
maxsecs=120             ; duración máxima de un mensaje (segundos)
minsecs=2               ; mensajes más cortos se descartan
maxlogins=3             ; intentos de contraseña
saycid=yes              ; dice el número de quien dejó el mensaje
envelope=yes            ; dice la fecha y hora del mensaje

[default]
; extensión => contraseña,Nombre
1000 => 1234,Buzon General
1001 => 1234,PC
1002 => 1234,Telefono
