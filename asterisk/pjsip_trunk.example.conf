; pjsip_trunk.conf - Troncal SIP con Ring.cr (sip.cr)
; Este archivo contiene la contrasena y NO se sube al repositorio

; Credenciales que da el portal de sip.cr
[sipcr-auth]
type=auth
auth_type=userpass
username=09ff3589
password=CAMBIAR

; Direccion del servidor de Ring.cr
;   qualify_frequency = envia un OPTIONS cada 30 s para mantener abierto el NAT
[sipcr-aor]
type=aor
contact=sip:148.227.162.40:5060
qualify_frequency=30

; Endpoint de la troncal
;   context = donde caen las llamadas entrantes en el dialplan
;   opciones de NAT iguales a las de los telefonos
[sipcr]
type=endpoint
transport=transport-udp
context=from-sipcr
disallow=all
allow=ulaw,alaw
aors=sipcr-aor
outbound_auth=sipcr-auth
from_user=09ff3589
from_domain=148.227.162.40
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
language=es

; Reconoce como troncal todo lo que llega desde la IP de Ring.cr
[sipcr-identify]
type=identify
endpoint=sipcr
match=148.227.162.40

; Registro: Asterisk se registra en Ring.cr y por ahi recibe las llamadas entrantes
[sipcr-registration]
type=registration
transport=transport-udp
outbound_auth=sipcr-auth
server_uri=sip:148.227.162.40:5060
client_uri=sip:09ff3589@148.227.162.40:5060
contact_user=09ff3589
retry_interval=60
expiration=300
