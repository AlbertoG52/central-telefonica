; extensions.conf - Plan de marcado

[general]
static=yes
writeprotect=no

[internas]
; Llamar a la PC
exten => 1001,1,NoOp(Llamada a la PC)
 same => n,Dial(PJSIP/1001,20)
 same => n,Hangup()

; Llamar al telefono
exten => 1002,1,NoOp(Llamada al telefono)
 same => n,Dial(PJSIP/1002,20)
 same => n,Hangup()

; Prueba de eco: marcar 600, hablar y se deberia escuchar
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()
