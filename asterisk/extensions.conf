; extensions.conf - Plan de marcado

[general]
static=yes
writeprotect=no

[globals]
; Horario de atencion (formato de GotoIfTime)
HORARIO=08:00-17:00
DIAS=mon-fri
; Carpeta donde se guardan los audios grabados del menu
AUDIOS=/var/lib/asterisk/sounds/custom

[internas]
; Opciones de Dial:
;   t = quien recibe la llamada puede transferir
;   T = quien hace la llamada puede transferir
; Si no contestan en 20 segundos, la llamada pasa al buzon
;   u = reproduce el mensaje de "no disponible"

; Llamar a la PC
exten => 1001,1,NoOp(Llamada a la PC)
 same => n,Dial(PJSIP/1001,20,tT)
 same => n,VoiceMail(1001@default,u)
 same => n,Hangup()

; Llamar al telefono
exten => 1002,1,NoOp(Llamada al telefono)
 same => n,Dial(PJSIP/1002,20,tT)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

; Sala de conferencias
exten => 8000,1,NoOp(Entrando a la sala de conferencias)
 same => n,Answer()
 same => n,ConfBridge(sala1,sala_bridge,sala_usuario)
 same => n,Hangup()

; Simula una llamada entrante: sigue el mismo flujo que usara la troncal
exten => 500,1,NoOp(Prueba de llamada entrante)
 same => n,Goto(verificar-horario,s,1)

; Escuchar el buzon propio: detecta la extension que llama
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Escuchar cualquier buzon: pide numero de buzon y contrasena
exten => *98,1,Answer()
 same => n,VoiceMailMain(@default)
 same => n,Hangup()

; Forzar horario en modo automatico (segun el reloj)
exten => *80,1,Set(DB(central/modo)=auto)
 same => n,Playback(beep)
 same => n,Hangup()

; Forzar horario abierto (para pruebas y la defensa)
exten => *81,1,Set(DB(central/modo)=abierto)
 same => n,Playback(beep)
 same => n,Hangup()

; Forzar horario cerrado (para pruebas y la defensa)
exten => *82,1,Set(DB(central/modo)=cerrado)
 same => n,Playback(beep)
 same => n,Hangup()

; Grabar los audios del menu desde un telefono
;   *71 = bienvenida, *72 = opcion invalida, *73 = fuera de horario
; Despues del beep se habla y se presiona # para terminar
exten => *71,1,Gosub(grabar-audio,s,1(bienvenida))
 same => n,Hangup()
exten => *72,1,Gosub(grabar-audio,s,1(opcion-invalida))
 same => n,Hangup()
exten => *73,1,Gosub(grabar-audio,s,1(fuera-horario))
 same => n,Hangup()

; Prueba de eco: marcar 600, hablar y se deberia escuchar
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

[grabar-audio]
; Graba un audio con el nombre recibido en ARG1 y luego lo reproduce
;   0  = no corta por silencio
;   60 = duracion maxima en segundos
;   k  = conserva la grabacion aunque se cuelgue
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Record(${AUDIOS}/${ARG1}.wav,0,60,k)
 same => n,Wait(1)
 same => n,Playback(${AUDIOS}/${ARG1})
 same => n,Return()

[verificar-horario]
; Revisa primero si el horario esta forzado y luego la hora actual
; Dentro de horario va al menu principal, fuera de horario al buzon general
exten => s,1,NoOp(Verificando horario - modo: ${DB(central/modo)})
 same => n,GotoIf($["${DB(central/modo)}" = "abierto"]?menu-principal,s,1)
 same => n,GotoIf($["${DB(central/modo)}" = "cerrado"]?fuera-horario,s,1)
 same => n,GotoIfTime(${HORARIO},${DIAS},*,*?menu-principal,s,1)
 same => n,Goto(fuera-horario,s,1)

[fuera-horario]
; Fuera de horario: reproduce el aviso y envia al buzon general 1000
;   s = omite las instrucciones del buzon (ya las dio el audio propio)
exten => s,1,NoOp(Fuera de horario)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${AUDIOS}/fuera-horario)
 same => n,VoiceMail(1000@default,s)
 same => n,Hangup()

[menu-principal]
; Menu IVR: reproduce la bienvenida y espera una opcion
; TIMEOUT(digit) = segundos de espera entre digitos (para el marcado directo)
; Despues de 3 intentos sin opcion valida, envia al buzon general
exten => s,1,NoOp(Dentro de horario - menu principal)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(INTENTOS=0)
 same => n,Set(TIMEOUT(digit)=2)
 same => n(menu),Background(${AUDIOS}/bienvenida)
 same => n,WaitExten(6)
 same => n(repetir),Set(INTENTOS=$[${INTENTOS} + 1])
 same => n,GotoIf($[${INTENTOS} >= 3]?sin-opcion)
 same => n,Goto(menu)
 same => n(sin-opcion),NoOp(Sin opcion valida despues de 3 intentos)
 same => n,VoiceMail(1000@default,u)
 same => n,Hangup()

; Opcion 1: suenan todos los telefonos al mismo tiempo
exten => 1,1,NoOp(Opcion 1 - todos los telefonos)
 same => n,Dial(PJSIP/1001&PJSIP/1002,25,tT)
 same => n,VoiceMail(1000@default,u)
 same => n,Hangup()

; Opcion 2: llamar al telefono
exten => 2,1,NoOp(Opcion 2 - telefono)
 same => n,Goto(internas,1002,1)

; Opcion 3: llamar a la PC
exten => 3,1,NoOp(Opcion 3 - PC)
 same => n,Goto(internas,1001,1)

; Marcado directo de extensiones
exten => 1001,1,NoOp(Marcado directo a la PC)
 same => n,Goto(internas,1001,1)
exten => 1002,1,NoOp(Marcado directo al telefono)
 same => n,Goto(internas,1002,1)

; Opcion invalida: avisa y repite el menu
exten => i,1,NoOp(Opcion invalida)
 same => n,Playback(${AUDIOS}/opcion-invalida)
 same => n,Goto(s,repetir)

; No marco nada: repite el menu
exten => t,1,NoOp(Tiempo agotado)
 same => n,Goto(s,repetir)
