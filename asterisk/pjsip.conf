; pjsip.conf - Endpoints SIP de la central

[global]
type=global
user_agent=PBX-TEC

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Plantillas

[endpoint-base](!)
type=endpoint
context=internas
language=es
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes        
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[auth-base](!)
type=auth
auth_type=userpass

[aor-base](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; Extensión 1001: computadora
[1001](endpoint-base)
auth=1001
aors=1001
callerid="PC" <1001>
mailboxes=1001@default

[1001](auth-base)
username=1001
password=computadora123

[1001](aor-base)

; Extensión 1002: telefono
[1002](endpoint-base)
auth=1002
aors=1002
callerid="Telefono" <1002>
mailboxes=1002@default

[1002](auth-base)
username=1002
password=telefono123

[1002](aor-base)
