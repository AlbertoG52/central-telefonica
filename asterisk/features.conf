; features.conf - Códigos de transferencia durante una llamada

[general]
transferdigittimeout=3     ; segundos para marcar la extensión destino
atxfernoanswertimeout=15   ; si el destino no contesta en una atendida, regresa la llamada

[featuremap]
blindxfer => ##            ; transferencia ciega: ## + extensión
atxfer => *2               ; transferencia atendida: *2 + extensión
