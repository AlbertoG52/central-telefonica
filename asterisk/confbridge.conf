; confbridge.conf - Sala de conferencias

[general]

; Perfil de la sala
[sala_bridge]
type=bridge
max_members=10

; Perfil de cada participante
[sala_usuario]
type=user
announce_user_count=yes     ; anuncia cuántas personas hay en la sala
music_on_hold_when_empty=yes ; música de sala
dtmf_passthrough=no
